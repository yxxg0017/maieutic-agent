name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.7"
      - name: 安装依赖
        working-directory: backend
        run: |
          uv venv --python 3.11 .venv
          uv pip install -e ".[dev]"
      - name: 单元测试
        working-directory: backend
        shell: bash
        run: |
          if [ -f .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          $PY -m pytest -q
      - name: 事件协议无漂移
        shell: bash
        run: |
          if [ -f backend/.venv/bin/python ]; then PY=backend/.venv/bin/python; else PY=backend/.venv/Scripts/python.exe; fi
          $PY scripts/gen_schema.py
          git diff --exit-code schemas/events.schema.json

  frontend:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: 安装依赖
        working-directory: apps/desktop
        run: npm ci
      - name: 生成类型并检查是否同步
        working-directory: apps/desktop
        run: |
          npm run gen:types
          git diff --exit-code src/types/protocol.ts
      - name: 类型检查
        working-directory: apps/desktop
        run: npx tsc -b
      - name: 单元测试
        working-directory: apps/desktop
        run: npm test
      - name: 构建
        working-directory: apps/desktop
        run: npx vite build

  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: 准备前端产物占位
        working-directory: apps/desktop
        run: |
          npm ci
          npx vite build
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\nexit 0\n' > "src-tauri/binaries/kel-sidecar-$(rustc -vV | awk '/^host:/ {print $2}')"
          chmod +x src-tauri/binaries/*
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
