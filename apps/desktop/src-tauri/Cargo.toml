[package]
name = "maieutic-desktop"
version = "0.1.0"
description = "知识激发智能体桌面端"
authors = ["maieutic-agent"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "maieutic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-shell = "=2.3.6"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rand = "=0.8.5"
base64 = "=0.22.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
